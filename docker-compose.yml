# docker-compose.yml
#
# Sobe somente a aplicacao Flask em container, usando a imagem oficial do
# Python (sem Dockerfile proprio - apenas este arquivo, como pedido).
#
# O banco Postgres NAO e criado aqui de proposito: tanto o banco local
# "sop" quanto o banco do sistema hospitalar "isivitaedb_hm" (consultado
# via INTEGRA_DATABASE_URL, somente leitura) ja existem no Postgres do
# host e nao devem ser recriados/dockerizados.
#
# Toda a conexao com o banco (DATABASE_URL, INTEGRA_DATABASE_URL,
# INTEGRA_SCHEMA) fica so nos arquivos .env / .env.homolog - nunca aqui.
#
# Servidor novo: basta "git clone" + "docker-compose up -d". Os arquivos
# .env e .env.homolog NAO vem do git (tem segredos); eles sao criados em
# branco na subida e a propria app os le (load_dotenv em app.py) - por
# isso NAO ha "env_file:" aqui (o docker-compose recusaria subir sem o
# arquivo). Com o arquivo em branco a app entra no modo de configuracao:
# abra o sistema no navegador, crie a senha do administrador e informe a
# conexao com o banco; a tela grava tudo (cifrado) no .env correspondente.
#
# gunicorn: --threads 4 deixa cada processo atender varias requisicoes ao
# mesmo tempo (a tela do SOP carrega varias listas em paralelo) e
# --timeout 180 evita que uma consulta lenta ao sistema hospitalar derrube a
# conexao (no navegador: "NetworkError when attempting to fetch resource").
# Precisa ficar ACIMA do INTEGRA_TIMEOUT_MS (db.py, hoje 150s): quem deve
# cancelar uma consulta lenta e o Postgres (erro claro), nao o gunicorn
# matando o worker (sem log, sem resposta).
#
# O mapeamento extra_hosts faz "host.docker.internal" (usado dentro dos
# .env quando o Postgres roda no mesmo host dos containers) funcionar
# tambem no Linux (no Docker Desktop/Mac/Windows ja funciona nativo).

services:
  web:
    image: python:3.11-slim
    container_name: prontuarios_hm
    working_dir: /app
    volumes:
      - .:/app
    environment:
      PYTHONUNBUFFERED: "1"
    ports:
      - "5500:5500"
    command: >
      sh -c "touch .env && chmod 600 .env &&
             pip install --no-cache-dir -r requirements.txt &&
             gunicorn -w 4 --threads 4 --timeout 180 -b 0.0.0.0:5500 app:app"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # Ambiente de homologacao/treinamento: mesma aplicacao, banco separado
  # ("sop_homol", mesmo servidor do banco principal, so o nome do banco
  # muda) para nao misturar dados de treino com os reais. O banco do
  # sistema hospitalar (INTEGRA_DATABASE_URL) e o MESMO de producao
  # (somente leitura, dados reais para praticar).
  #
  # AMBIENTE=homolog faz a app usar o arquivo .env.homolog em vez do .env
  # de producao (leitura e gravacao pela tela de configuracao).
  #
  # "sop_homol" e criado automaticamente (banco + tabelas) no primeiro
  # start, pelo bootstrap do proprio app (db.preparar_banco) - nao precisa
  # criar a mao.
  web_homolog:
    image: python:3.11-slim
    container_name: prontuarios_hm_homolog
    working_dir: /app
    volumes:
      - .:/app
    environment:
      AMBIENTE: homolog
      PYTHONUNBUFFERED: "1"
    ports:
      - "5501:5501"
    command: >
      sh -c "touch .env.homolog && chmod 600 .env.homolog &&
             pip install --no-cache-dir -r requirements.txt &&
             gunicorn -w 2 --threads 4 --timeout 180 -b 0.0.0.0:5501 app:app"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
