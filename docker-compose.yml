# docker-compose.yml
#
# Sobe somente a aplicacao Flask em container, usando a imagem oficial do
# Python (sem Dockerfile proprio - apenas este arquivo, como pedido).
#
# O banco Postgres NAO e criado aqui de proposito: tanto o banco local
# "sop" quanto o banco do sistema hospitalar "isivitaedb_hm" (consultado
# via INTEGRA_DATABASE_URL, somente leitura) ja existem no Postgres do
# host e nao devem ser recriados/dockerizados.
#
# Importante antes de rodar "docker compose up":
#   - Dentro do container, "localhost" aponta para o proprio container,
#     nao para o host. No seu .env, troque "localhost" por
#     "host.docker.internal" em DATABASE_URL e INTEGRA_DATABASE_URL.
#   - O mapeamento extra_hosts abaixo faz "host.docker.internal" funcionar
#     tambem no Linux (no Docker Desktop/Mac/Windows ja funciona nativo).

services:
  web:
    image: python:3.11-slim
    container_name: prontuarios_hm
    working_dir: /app
    volumes:
      - .:/app
    env_file:
      - .env
    ports:
      - "8000:8000"
    command: >
      sh -c "pip install --no-cache-dir -r requirements.txt &&
             gunicorn -w 4 -b 0.0.0.0:8000 app:app"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
