# docker-compose.yml
#
# Sobe somente a aplicacao Flask em container, usando a imagem oficial do
# Python (sem Dockerfile proprio - apenas este arquivo, como pedido).
#
# O banco Postgres NAO e criado aqui de proposito: tanto o banco local
# "sop" quanto o banco do sistema hospitalar "isivitaedb_hm" (consultado
# via INTEGRA_DATABASE_URL, somente leitura) ja existem no Postgres do
# host e nao devem ser recriados/dockerizados.
#
# Toda a conexao com o banco (DATABASE_URL, INTEGRA_DATABASE_URL,
# INTEGRA_SCHEMA) fica so nos arquivos .env / .env.homolog - nunca aqui.
# Isso permite trocar de servidor de banco (ex: apontar para uma maquina
# nova) so editando esses arquivos ou pela tela "Configuração do Banco"
# dentro da aplicacao, sem precisar editar nem reconstruir os containers.
#
# O mapeamento extra_hosts faz "host.docker.internal" (usado dentro dos
# .env quando o Postgres roda no mesmo host dos containers) funcionar
# tambem no Linux (no Docker Desktop/Mac/Windows ja funciona nativo).

services:
  web:
    image: python:3.11-slim
    container_name: prontuarios_hm
    working_dir: /app
    volumes:
      - .:/app
    env_file:
      - .env
    ports:
      - "5500:5500"
    command: >
      sh -c "pip install --no-cache-dir -r requirements.txt &&
             gunicorn -w 4 -b 0.0.0.0:5500 app:app"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # Ambiente de homologacao/treinamento: mesma aplicacao, banco separado
  # ("sop_homol", mesmo servidor do banco principal, so o nome do banco
  # muda) para nao misturar dados de treino com os reais. O banco do
  # sistema hospitalar (INTEGRA_DATABASE_URL) e o MESMO de producao
  # (somente leitura, dados reais para praticar).
  #
  # Usa um arquivo de configuracao proprio (.env.homolog) em vez do .env
  # de producao, justamente para poder apontar para um banco/servidor
  # diferente sem qualquer valor cravado neste docker-compose.yml.
  #
  # "sop_homol" e criado automaticamente (banco + tabelas) no primeiro
  # start, pelo bootstrap do proprio app (db.preparar_banco) - nao precisa
  # criar a mao.
  web_homolog:
    image: python:3.11-slim
    container_name: prontuarios_hm_homolog
    working_dir: /app
    volumes:
      - .:/app
    env_file:
      - .env.homolog
    ports:
      - "5501:5501"
    command: >
      sh -c "pip install --no-cache-dir -r requirements.txt &&
             gunicorn -w 2 -b 0.0.0.0:5501 app:app"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
